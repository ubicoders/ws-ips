# sb workspace ws_ips (sb 0.5.0+). Committed; paths are relative to this file.
# `sb install .` writes the installed copy to ~/.swarmbotix/workspaces/ws_ips/,
# imports and compiles messages/custom/ into the vault, and regenerates every
# module's swarmbotix_io/. Re-run it after editing this file, a module's
# sb.dev.yml, or a .proto. See docs/workspace.md.

name: ws_ips
modules:
  ips_cam_gcam_pub: modules/ips_cam_gcam_pub
  ips_detect:       modules/ips_detect
  ips_track:        modules/ips_track
  ips_viz:          modules/ips_viz
  # Calibration is a one-shot step, not part of the live pipeline: registered
  # and rendered, started by hand (`sb run ips_calib`), skipped by `sb up`.
  ips_calib:        { path: modules/ips_calib, up: false }

messages:
  - { style: ros2, path: messages/custom, backends: [proto, iox2] }

# One id per camera. Must match the camera lists in every module's parameters yaml.
instances:
  ips_cam_gcam_pub:
    - id: sb00
      label: "Camera sb00"
    - id: sb01
      label: "Camera sb01"
    - id: sb02
      label: "Camera sb02"
    - id: sb03
      label: "Camera sb03"
  ips_detect:
    - id: sb00
      label: "Detector sb00, reads ips_cam_gcam_pub-sb00"
    - id: sb01
      label: "Detector sb01, reads ips_cam_gcam_pub-sb01"
    - id: sb02
      label: "Detector sb02, reads ips_cam_gcam_pub-sb02"
    - id: sb03
      label: "Detector sb03, reads ips_cam_gcam_pub-sb03"
