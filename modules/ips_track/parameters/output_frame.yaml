# output_frame.yaml: the axis convention of the PUBLISHED cube poses. Read by
# ips_track at startup (and by ips_viz, which undoes it so rerun always draws the
# tracker's internal frame). The tracker computes in the board frame regardless;
# this is a relabelling of the axes applied to position, rotation, euler,
# quaternion and velocity right before publishing. Restart ips_track and ips_viz
# after editing.
#
# The board frame (RDF, what calibration defines): x along the board's top row,
# y toward its bottom row, z down into the floor. A camera looking into the
# ground. The other conventions stand that camera on the floor looking along the
# board toward its top row:
#   forward = board -y, right = board +x, down = board +z, up = board -z.
# The same relabelling is applied to the cube body (FRONT = forward, RIGHT =
# right, BOTTOM = down), so the published rotation stays a proper rotation.
#
#   RDF   right, down, forward   = the board frame, no conversion (default)
#   FRD   forward, right, down   PX4 body / NED-like
#   FRU   forward, right, up
convention: FRU
