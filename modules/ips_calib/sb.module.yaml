# sb module manifest (sb 0.8.0+). One-shot: subscribes to every detector, fits,
# writes calibration/extrinsics/, exits. Not part of `sb up`: a node of
# calib.flow.yaml only, started with `sb up calib`.
module: ips_calib
language: rust
subscribers:
  # Bare topic on purpose; main() overrides `full` at startup to the wildcard
  # <device>/ws_ips/ips_detect-$*/zenoh/markers (every detector instance).
  markers:
    type: ros2/custom/MarkerDetections
    transport: zenoh
