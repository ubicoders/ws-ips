[package]
name = "ips_calib"
version = "0.1.0"
edition = "2021"
description = "Extrinsic calibration of the IPS cameras from the detectors' marker stream (Kabsch fit against the calib board), with a live camera window"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ips_calib"
path = "src/main.rs"

[features]
# `ui`: the interactive window (OpenCV highgui). Off, the binary only runs the
# headless one-shot (`ui: false` in ips_calib.yaml), which lets the logic
# build and test on a machine without OpenCV. `sb up` builds the default set.
default = ["ui"]
ui = ["dep:opencv"]

[dependencies]
# Fan-in subscriber on every detector's marker stream. Matches the host zenoh
# 1.9.0; only the sync `Wait` API is used, so no async runtime is pulled in.
zenoh = "1.9.0"

# protobuf decoding of custom/MarkerDetections. sb emits no Rust from its proto
# backend, so build.rs generates the `swarmbotix.custom` types with prost-build.
prost = "0.14"

# Kabsch fit (3x3 SVD) and the world-frame board model; serde for the
# nested parameters/ips_calib.yaml.
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Every camera's image stream for the window. Pinned exactly to the host
# iceoryx2 v0.9.3, as in ips_detect: IPC is not compatible across 0.9.x point
# releases, so the whole bb/pal family must be `=0.9.3` or cargo silently pulls
# another patch for the transitive shm crates.
iceoryx2 = "=0.9.3"
iceoryx2-bb-concurrency = "=0.9.3"
iceoryx2-bb-container = "=0.9.3"
iceoryx2-bb-derive-macros = "=0.9.3"
iceoryx2-bb-elementary = "=0.9.3"
iceoryx2-bb-elementary-traits = "=0.9.3"
iceoryx2-bb-linux = "=0.9.3"
iceoryx2-bb-lock-free = "=0.9.3"
iceoryx2-bb-loggers = "=0.9.3"
iceoryx2-bb-memory = "=0.9.3"
iceoryx2-bb-posix = "=0.9.3"
iceoryx2-bb-print = "=0.9.3"
iceoryx2-bb-system-types = "=0.9.3"
iceoryx2-cal = "=0.9.3"
iceoryx2-log = "=0.9.3"
iceoryx2-log-types = "=0.9.3"
iceoryx2-pal-concurrency-sync = "=0.9.3"
iceoryx2-pal-configuration = "=0.9.3"
iceoryx2-pal-os-api = "=0.9.3"
iceoryx2-pal-posix = "=0.9.3"
iceoryx2-pal-print = "=0.9.3"

# The window: highgui for the one window and its keys, imgproc for the tiles
# and the text. `clang-runtime` dlopens libclang at build time
# (LIBCLANG_PATH=/usr/lib/llvm-18/lib). Optional, behind the `ui` feature.
opencv = { version = "0.98", default-features = false, features = ["highgui", "imgproc", "clang-runtime"], optional = true }

[build-dependencies]
# Generate Rust types from messages/custom/*.proto of this repository.
# protoc-bin-vendored ships a protoc binary, so no system protoc is needed.
prost-build = "0.14"
protoc-bin-vendored = "3"
