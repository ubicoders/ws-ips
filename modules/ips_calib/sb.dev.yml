# sb module definition (sb 0.5.0+): portable, committed. No root: line, so the
# module root is this folder. `sb install .` at the repository root renders
# swarmbotix_io/ from it.
module: ips_calib
language: rust
io_dir: swarmbotix_io
publishers: []
subscribers:
  # Bare topic on purpose; main() overrides `full` at startup to the wildcard
  # <device>/ws_ips/ips_detect-$*/zenoh/markers (every detector instance).
  - name: markers
    topic: markers
    type: ros2/custom/MarkerDetections
    transport: zenoh
