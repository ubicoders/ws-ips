# calib_params.yaml: run settings for ips_calib, the EXTRINSIC calibration.
#
# What this module solves: each camera's pose in the world frame (R, t), from
# the AprilTag board the detectors see. Output: calibration/extrinsics/sbNN_full.yaml.
#
# What this file is NOT about:
#   - intrinsics (K, distortion). Those come from Kalibr, outside this repo, and
#     live in calibration/intrinsics/sbNN-camchain.yaml. ips_calib only copies K
#     into its output so one file per camera holds everything.
#   - the board geometry and where it sits in the world. That is
#     calibration/ips_calib.yaml, shared data, not a run setting.
#
# Only the knobs of one calibration run are here. Read at startup, no flags.
# Camera index into modules/ips_cam_gcam_pub/parameters/cam_params.yaml: 0 -> sb00, 1 -> sb01, ...
# e.g. 0 reads calibration/intrinsics/sb00-camchain.yaml and writes calibration/extrinsics/sb00_full.yaml
cameras: [0, 1, 2, 3]
frames: 300             # marker frames to accumulate per camera before fitting
timeout_s: 30           # give up waiting for a camera after this long
min_markers: 3          # a camera that saw fewer distinct board ids is skipped
