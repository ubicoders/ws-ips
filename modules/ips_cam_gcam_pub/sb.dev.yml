# sb module definition (sb 0.5.0+): portable, committed. No root: line, so the
# module root is this folder. `sb install .` at the repository root renders
# swarmbotix_io/ from it.
module: ips_cam_gcam_pub
language: rust
io_dir: swarmbotix_io
publishers:
  - name: image                      # <device>/ws_ips/ips_cam_gcam_pub-sbNN/iox2/image
    topic: image
    type: ros2/sensor_msgs/Image1280x1024
    transport: iceoryx2
subscribers: []
