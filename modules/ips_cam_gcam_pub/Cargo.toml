[package]
name = "ips_cam_gcam_pub"
version = "0.1.0"
edition = "2021"
description = "HuaTeng GigE camera publisher: MONO8 1280x1024 frames to iceoryx2 Image1280x1024, one thread per camera"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ips_cam_gcam_pub"
path = "src/main.rs"

[dependencies]
# Pinned EXACTLY to the host iceoryx2 v0.9.3. iceoryx2 is NOT IPC-compatible
# across versions: every shared-memory segment is stamped with
# major.minor.patch and a mismatching node fails with `VersionMismatch`. The
# whole family must be 0.9.3 (the crates' own deps are caret `^0.9.x`, so
# without these exact pins cargo silently pulls another patch for the
# transitive bb/pal crates that define the shm layout).
iceoryx2 = "=0.9.3"
iceoryx2-bb-concurrency = "=0.9.3"
iceoryx2-bb-container = "=0.9.3"
iceoryx2-bb-derive-macros = "=0.9.3"
iceoryx2-bb-elementary = "=0.9.3"
iceoryx2-bb-elementary-traits = "=0.9.3"
iceoryx2-bb-linux = "=0.9.3"
iceoryx2-bb-lock-free = "=0.9.3"
iceoryx2-bb-loggers = "=0.9.3"
iceoryx2-bb-memory = "=0.9.3"
iceoryx2-bb-posix = "=0.9.3"
iceoryx2-bb-print = "=0.9.3"
iceoryx2-bb-system-types = "=0.9.3"
iceoryx2-cal = "=0.9.3"
iceoryx2-log = "=0.9.3"
iceoryx2-log-types = "=0.9.3"
iceoryx2-pal-concurrency-sync = "=0.9.3"
iceoryx2-pal-configuration = "=0.9.3"
iceoryx2-pal-os-api = "=0.9.3"
iceoryx2-pal-posix = "=0.9.3"
iceoryx2-pal-print = "=0.9.3"

# The camera driver (git submodule). Library only: the CLI and the SDK
# downloader stay out of this build. The vendor library is loaded at run time.
gcam-mvsdk-rs = { path = "../../drivers/gcam-mvsdk-rs", default-features = false }

# parameters/cam_params.yaml
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
