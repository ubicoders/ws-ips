# sb module manifest (sb 0.8.0+). The vendor GigE SDK is Linux-only: listing
# only linux under platforms restricts the module to it. A platform entry needs
# at least one key, hence `requires: [cargo]`, which the Rust build needs anyway.
module: ips_cam_gcam_pub
language: rust
platforms:
  linux:
    requires: [cargo]
    # Where the vendor SDK keeps the cameras' parameter groups (A is loaded on
    # every open), per-camera data files and its log. Relative to this module
    # folder, which is the working directory when sb launches the node; the
    # same folder the gcam-mvsdk-rs command uses through .vscode/settings.json.
    env:
      GCAM_MVSDK_DATA_DIR: ${GCAM_MVSDK_DATA_DIR:-../../drivers/gcam-mvsdk-rs/data}
publishers:
  image:                                    # <device>/ws_ips/ips_cam_gcam_pub-sbNN/iox2/image
    type: ros2/sensor_msgs/Image1280x1024
    transport: iceoryx2
