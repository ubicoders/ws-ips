[package]
name = "ips_detect"
version = "0.1.0"
edition = "2021"
description = "Per-camera ArUco/AprilTag marker detector: iceoryx2 image in, camera-frame marker poses out over zenoh"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ips_detect"
path = "src/main.rs"

[dependencies]
# Pinned exactly to the host iceoryx2 v0.9.3. IPC is not compatible across
# 0.9.x point releases, so the whole bb/pal family must be `=0.9.3` or cargo
# silently pulls another patch for the transitive shm crates.
iceoryx2 = "=0.9.3"
iceoryx2-bb-concurrency = "=0.9.3"
iceoryx2-bb-container = "=0.9.3"
iceoryx2-bb-derive-macros = "=0.9.3"
iceoryx2-bb-elementary = "=0.9.3"
iceoryx2-bb-elementary-traits = "=0.9.3"
iceoryx2-bb-linux = "=0.9.3"
iceoryx2-bb-lock-free = "=0.9.3"
iceoryx2-bb-loggers = "=0.9.3"
iceoryx2-bb-memory = "=0.9.3"
iceoryx2-bb-posix = "=0.9.3"
iceoryx2-bb-print = "=0.9.3"
iceoryx2-bb-system-types = "=0.9.3"
iceoryx2-cal = "=0.9.3"
iceoryx2-log = "=0.9.3"
iceoryx2-log-types = "=0.9.3"
iceoryx2-pal-concurrency-sync = "=0.9.3"
iceoryx2-pal-configuration = "=0.9.3"
iceoryx2-pal-os-api = "=0.9.3"
iceoryx2-pal-posix = "=0.9.3"
iceoryx2-pal-print = "=0.9.3"

# OpenCV bindings. `aruco` is the contrib module that carries ArUco and
# AprilTag on OpenCV 4.6 (objdetect only absorbed them in 4.7). No `highgui`:
# the annotated frame goes out over iceoryx2 for ips_viz instead of a window.
# `clang-runtime` dlopens libclang at build time (LIBCLANG_PATH=/usr/lib/llvm-18/lib).
opencv = { version = "0.98", default-features = false, features = ["aruco", "calib3d", "imgproc", "imgcodecs", "clang-runtime"] }

# Marker detections go out over zenoh, matching the host zenoh 1.9.0. The
# generated publisher uses the sync `Wait` API, so no async runtime is pulled in.
zenoh = "1.9.0"

# protobuf encoding of custom/MarkerDetections (types generated by build.rs).
prost = "0.14"

# parameters/detector_params.yaml.
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[build-dependencies]
# build.rs compiles messages/custom/*.proto from this repository with prost.
# protoc-bin-vendored ships protoc, so the build needs no system protoc on PATH.
prost-build = "0.14"
protoc-bin-vendored = "3"
