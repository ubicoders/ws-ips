# sb workspace ws_ips. setup.sh installs this file to ~/.swarmbotix/workspaces/ws_ips/
# with <REPO> replaced by the absolute path of this clone. See workspace/README.md.

modules:
  ips_cam_gcam_pub: <REPO>/ips_cam_gcam_pub/sb.dev.yml
  ips_detect:       <REPO>/ips_detect/sb.dev.yml
  ips_track:        <REPO>/ips_track/sb.dev.yml
  ips_viz:          <REPO>/ips_viz/sb.dev.yml

# One id per camera. Must match the camera lists in every module's parameters yaml.
instances:
  ips_cam_gcam_pub:
    - id: sb00
      label: "Camera sb00"
    - id: sb01
      label: "Camera sb01"
    - id: sb02
      label: "Camera sb02"
    - id: sb03
      label: "Camera sb03"
  ips_detect:
    - id: sb00
      label: "Detector sb00, reads ips_cam_gcam_pub-sb00"
    - id: sb01
      label: "Detector sb01, reads ips_cam_gcam_pub-sb01"
    - id: sb02
      label: "Detector sb02, reads ips_cam_gcam_pub-sb02"
    - id: sb03
      label: "Detector sb03, reads ips_cam_gcam_pub-sb03"
