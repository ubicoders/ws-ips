[package]
name = "ips_viz"
version = "0.1.0"
edition = "2021"
description = "rerun viewer for the IPS pipeline: subscribes to ips_track's cube_poses and streams cameras, cubes and plots to a running rerun viewer"

# The tracker never talks to rerun itself. This module subscribes to the
# cube_poses ips_track publishes over zenoh, fetches each camera's extrinsics
# once from ips_track's cam_param service, and streams the scene to rerun.
# Cube box sizes come from parameters/viz_params.yaml.

[lib]
path = "src/lib.rs"

[[bin]]
name = "ips_viz"
path = "src/main.rs"

[dependencies]
# Cross-device transport: subscribe to cube_poses and query cam_param. Matches
# the host zenoh 1.9.0. Sync `Wait` API only, so no async runtime is pulled in.
zenoh = "1.9.0"

# Shared-memory transport: subscribe to the per-camera debug color images that
# ips_detect publishes (sensor_msgs/Image1280x1024Color over iceoryx2, one
# service per camera).
# Pinned EXACTLY to the host iceoryx2 v0.9.3. IPC is not compatible across 0.9.x
# point releases, so the whole bb/pal family must be `=0.9.3` or cargo silently
# pulls another patch for transitive shm crates.
iceoryx2 = "=0.9.3"
iceoryx2-bb-concurrency = "=0.9.3"
iceoryx2-bb-container = "=0.9.3"
iceoryx2-bb-derive-macros = "=0.9.3"
iceoryx2-bb-elementary = "=0.9.3"
iceoryx2-bb-elementary-traits = "=0.9.3"
iceoryx2-bb-linux = "=0.9.3"
iceoryx2-bb-lock-free = "=0.9.3"
iceoryx2-bb-loggers = "=0.9.3"
iceoryx2-bb-memory = "=0.9.3"
iceoryx2-bb-posix = "=0.9.3"
iceoryx2-bb-print = "=0.9.3"
iceoryx2-bb-system-types = "=0.9.3"
iceoryx2-cal = "=0.9.3"
iceoryx2-log = "=0.9.3"
iceoryx2-log-types = "=0.9.3"
iceoryx2-pal-concurrency-sync = "=0.9.3"
iceoryx2-pal-configuration = "=0.9.3"
iceoryx2-pal-os-api = "=0.9.3"
iceoryx2-pal-posix = "=0.9.3"
iceoryx2-pal-print = "=0.9.3"

# protobuf decoding of the CubePoses payload (types generated by build.rs).
prost = "0.14"

# Camera extrinsics (3x3 R, 3-vector t), viz_params.yaml (serde_yaml) and the
# JSON the cam_param service replies with (serde_json).
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Stream to an already running rerun viewer over gRPC. Pinned to the installed
# viewer, rerun-cli 0.32.2. default-features = false drops the bundled native and
# web viewer (egui, wgpu), dataframe and importers: `sdk` is logging plus the
# gRPC client, `server` the gRPC transport.
rerun = { version = "0.32", default-features = false, features = ["sdk", "server"] }

[build-dependencies]
# Rust types for messages/custom/{MarkerDetections,CubePoses}.proto.
# protoc-bin-vendored ships protoc, so no system protoc is needed.
prost-build = "0.14"
protoc-bin-vendored = "3"
