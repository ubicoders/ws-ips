# IPS calib board: known fiducial geometry for camera extrinsic calibration.
# ips_calib builds each marker's 3-D position in `world_frame` from this file,
# then solves every camera's pose in that frame from the markers it sees.
# Measure the printed tags with the caliper and put the measured size here.

world_frame: RDF                  # x = right, y = down, z = forward

board:
  family: april                   # AprilTag 36h11
  marker_size_mm: 185             # tag side (black square), measured
  marker_gap_mm: 30               # edge to edge; centre pitch = size + gap
  layout:                         # marker id per [row][col]; row 0 = top, col 0 = left
    - [0, 1, 2]
    - [3, 4, 5]

placement:
  origin_id: 1                    # this marker's centre is the world origin
  position_mm: [0, 0, 100]        # world position of origin_id's centre
  orientation_deg: [0, 0, 0]      # XYZ Euler of the board in the world frame
